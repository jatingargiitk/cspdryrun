name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q -rs

  browser-parity:
    # loads the example site and edge-case fixtures in headless Chromium and
    # checks every CSP violation the browser fires was predicted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -rs tests/test_browser_parity.py

  readme-examples:
    # re-runs every README command and checks the recorded outputs did not change
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: ./examples/readme_examples.sh
      - run: git status --porcelain && git diff --exit-code examples/
