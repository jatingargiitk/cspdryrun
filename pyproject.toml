[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cspdryrun"
version = "0.1.0"
description = "Check what a Content-Security-Policy would block on a built static site, before you deploy it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jatin Garg" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["csp", "content-security-policy", "security-headers", "static-site", "netlify", "vercel", "ci"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cspdryrun = "cspdryrun.cli:main"

[project.urls]
Homepage = "https://github.com/jatingargiitk/cspdryrun"

[tool.setuptools]
packages = ["cspdryrun"]
